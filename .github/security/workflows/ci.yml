name: Repository security on every push
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scan-types:
        description: Analisis que se ejecutaran
        type: choice
        default: all
        options:
          - all
          - sast
          - iac
          - dependencies
          - sast,iac
          - sast,dependencies
          - iac,dependencies
permissions:
  contents: read
jobs:
  security:
    uses: ./.github/workflows/security-assessment.yml
    with:
      scan-types: ${{ inputs.scan-types || 'all' }}
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SNYK_ORG: ${{ secrets.SNYK_ORG }}
